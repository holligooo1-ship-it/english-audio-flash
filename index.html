<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Memory ERTO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" type="image/png" href="Icono 192.png">
<link rel="apple-touch-icon" href="Icono 192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash-screen">
  <img src="english memory logo.png" alt="Logo" class="splash-logo">
  <h1 class="splash-title">English Memory ERTO</h1>
  <div class="splash-loader"></div>
</div>

<div class="app">

<div class="view home-view" id="homeView">
  <div class="home-header">
    <img src="english memory logo.png" alt="Logo" class="home-logo">
    <h1>English Memory ERTO</h1>
    <p class="home-subtitle">Elige tu mazo</p>
    <button id="installBtn" class="install-btn" style="display: none;">
      <i data-lucide="download"></i> Instalar App
    </button>
  </div>
  <div class="deck-grid" id="deckGrid"></div>
  <div class="home-footer">English Memory</div>
</div>

<div class="view player-view hidden" id="playerView">
  <header class="topbar">
    <button id="btnBack" class="back-btn" title="Volver" aria-label="Volver">
      <i data-lucide="chevron-left"></i>
    </button>
    <div class="topbar-brand">
      <span class="app-name" id="deckName">—</span>
    </div>
    <div class="topbar-actions">
      <button id="btnGame" class="toolbar-btn game-btn" title="Minijuegos">
        <i data-lucide="gamepad-2"></i>
        <span class="btn-label">Jugar</span>
      </button>
      <button id="btnDeck" class="toolbar-btn" title="Ver mazo completo">
        <i data-lucide="book-open"></i>
        <span class="btn-label">Mazo</span>
      </button>
      <button id="btnOrder" class="toolbar-btn" title="Cambiar orden">
        <i data-lucide="repeat"></i>
        <span class="btn-label" id="orderLabel">Secuencial</span>
      </button>
      <button id="btnDirection" class="toolbar-btn" title="Cambiar dirección">
        <i data-lucide="arrow-right-left"></i>
        <span class="btn-label" id="directionLabel">EN → ES</span>
      </button>
    </div>
  </header>

  <main class="card-area">
    <div class="card" id="card">
      <div class="status" id="status">Cargando…</div>
      <div class="word-en" id="wordEn">—</div>
      <div class="word-es" id="wordEs">—</div>
      <div class="example" id="example"></div>
      <div class="alt" id="alt"></div>
      <div class="note" id="note"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="counter" id="counter">0 / 0</div>
    </div>
  </main>

  <footer class="controls">
    <button id="btnPrev" class="ctrl-btn" title="Anterior" aria-label="Anterior">
      <i data-lucide="skip-back"></i>
    </button>
    <button id="btnPlay" class="ctrl-btn primary" title="Reproducir" aria-label="Reproducir">
      <i data-lucide="play" class="icon-play"></i>
      <i data-lucide="pause" class="icon-pause"></i>
    </button>
    <button id="btnNext" class="ctrl-btn" title="Siguiente" aria-label="Siguiente">
      <i data-lucide="skip-forward"></i>
    </button>

    <div class="speed-wrap">
      <label for="speed">Velocidad</label>
      <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
      <span id="speedValue">1.0x</span>
    </div>
    <div class="pause-wrap">
      <label for="pause">Pausa</label>
      <input type="range" id="pause" min="0" max="5" step="0.5" value="2">
      <span id="pauseValue">2s</span>
    </div>
    <div class="limit-wrap">
      <label for="limit">Tarjetas</label>
      <select id="limit"></select>
    </div>
    <div class="tag-wrap">
      <label for="tag">Categoría</label>
      <select id="tag"></select>
    </div>
  </footer>
</div>

<!-- MENÚ DE JUEGOS -->
<div class="deck-modal" id="gameMenuModal">
  <div class="deck-modal-content" style="max-width: 400px;">
    <div class="deck-modal-header">
      <h2>Configurar Juego</h2>
      <button class="close-btn" id="btnCloseGameMenu"><i data-lucide="x"></i></button>
    </div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      
      <div class="game-select-group">
        <label for="gameDirSelect">Dirección</label>
        <select id="gameDirSelect" class="game-select">
          <option value="en-es">Inglés → Español</option>
          <option value="es-en">Español → Inglés</option>
        </select>
      </div>
      
      <div class="game-select-group">
        <label for="gameTagSelect">Categoría</label>
        <select id="gameTagSelect" class="game-select"></select>
      </div>

      <!-- NUEVO SELECTOR DE CANTIDAD -->
      <div class="game-select-group">
        <label for="gameLimitSelect">Cantidad de palabras</label>
        <select id="gameLimitSelect" class="game-select"></select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <button class="game-menu-btn" id="btnPlayTF">
          <i data-lucide="check-circle"></i> Verdadero o Falso
        </button>
        <button class="game-menu-btn" id="btnPlayMC">
          <i data-lucide="list"></i> Opción Múltiple
        </button>
        <button class="game-menu-btn" disabled style="opacity: 0.5; cursor: not-allowed;">
          <i data-lucide="type"></i> Dictado Rápido (Pronto)
        </button>
      </div>
    </div>
  </div>
</div>

<!-- JUEGO 1: VERDADERO O FALSO -->
<div class="game-overlay" id="gameView">
  <header class="game-header">
    <div class="game-score-box">
      <span>Puntos</span>
      <strong id="tfScore">0</strong>
    </div>
    <div class="game-header-actions">
      <button id="btnGameDir" class="game-icon-btn" title="Cambiar dirección">
        <i data-lucide="arrow-right-left"></i>
      </button>
      <button id="btnGameAudio" class="game-icon-btn" title="Escuchar de nuevo">
        <i data-lucide="volume-2"></i>
      </button>
    </div>
    <div class="game-timer-box">
      <i data-lucide="timer"></i>
      <strong id="tfTimer">60s</strong>
    </div>
    <button class="close-btn" id="btnCloseGame"><i data-lucide="x"></i></button>
  </header>

  <main class="game-area">
    <div class="tf-card" id="tfCard">
      <div class="tf-word" id="tfWord">—</div>
      <div class="tf-translation" id="tfTranslation">—</div>
    </div>
  </main>

  <footer class="game-controls">
    <button class="tf-btn false-btn" id="btnFalse"><i data-lucide="x"></i> Falso</button>
    <button class="tf-btn true-btn" id="btnTrue"><i data-lucide="check"></i> Verdadero</button>
  </footer>

  <div class="game-over" id="tfGameOver" style="display: none;">
    <h2>¡Tiempo terminado!</h2>
    <p>Tu puntuación es:</p>
    <div class="final-score" id="tfFinalScore">0</div>
    <button class="btn-primary" id="btnRestartTF" style="margin-top: 20px;">Jugar de nuevo</button>
  </div>
</div>

<!-- JUEGO 2: OPCIÓN MÚLTIPLE -->
<div class="game-overlay" id="mcGameView">
  <header class="game-header">
    <div class="game-score-box">
      <span>Puntos</span>
      <strong id="mcScore">0</strong>
    </div>
    <div class="game-header-actions">
      <button id="btnMCGameDir" class="game-icon-btn" title="Cambiar dirección">
        <i data-lucide="arrow-right-left"></i>
      </button>
      <button id="btnMCGameAudio" class="game-icon-btn" title="Escuchar de nuevo">
        <i data-lucide="volume-2"></i>
      </button>
    </div>
    <div class="game-timer-box">
      <i data-lucide="timer"></i>
      <strong id="mcTimer">60s</strong>
    </div>
    <button class="close-btn" id="btnCloseMCGame"><i data-lucide="x"></i></button>
  </header>

  <main class="game-area">
    <div class="tf-card" id="mcCard" style="padding: 30px;">
      <div class="tf-word" id="mcWord">—</div>
    </div>
  </main>

  <footer class="mc-controls" id="mcOptionsContainer">
    <!-- Los 4 botones se generan aquí dinámicamente -->
  </footer>

  <div class="game-over" id="mcGameOver" style="display: none;">
    <h2>¡Tiempo terminado!</h2>
    <p>Tu puntuación es:</p>
    <div class="final-score" id="mcFinalScore">0</div>
    <button class="btn-primary" id="btnRestartMC" style="margin-top: 20px;">Jugar de nuevo</button>
  </div>
</div>

<div class="deck-modal" id="deckModal">
  <div class="deck-modal-content">
    <div class="deck-modal-header">
      <h2 id="deckTitle">Mazo completo</h2>
      <button id="btnCloseDeck" class="close-btn" title="Cerrar" aria-label="Cerrar">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="deck-list" id="deckList"></div>
  </div>
</div>

<audio id="player"></audio>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>

</body>
</html>
