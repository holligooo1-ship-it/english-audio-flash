<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Audio Flash</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="Icono 192.png">
<link rel="apple-touch-icon" href="Icono 192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <img src="english memory logo.png" alt="Logo" class="logo">
    <span class="app-name">Audio Flash</span>
    <button id="btnDirection" class="direction-btn">EN → ES 🔄</button>
  </header>

  <main class="card-area">
    <div class="card" id="card">
      <div class="status" id="status">Cargando…</div>
      <div class="word-en" id="wordEn">—</div>
      <div class="word-es" id="wordEs">—</div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="counter" id="counter">0 / 0</div>
    </div>
  </main>

  <footer class="controls">
    <button id="btnPrev" title="Anterior">⏮</button>
    <button id="btnPlay" class="primary" title="Play/Pausa">▶</button>
    <button id="btnNext" title="Siguiente">⏭</button>

    <div class="speed-wrap">
      <label for="speed">Velocidad</label>
      <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
      <span id="speedValue">1.0x</span>
    </div>

    <div class="pause-wrap">
      <label for="pause">Pausa</label>
      <input type="range" id="pause" min="0" max="5" step="0.5" value="2">
      <span id="pauseValue">2s</span>
    </div>
  </footer>

</div>

<audio id="player"></audio>

<script src="app.js"></script>

</body>
</html>
