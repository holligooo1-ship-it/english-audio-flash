<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Audio Flash</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" type="image/png" href="Icono 192.png">
<link rel="apple-touch-icon" href="Icono 192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================== HOME: SELECTOR DE MAZOS ================== -->
<div class="view home-view" id="homeView">
  <div class="home-header">
    <img src="english memory logo.png" alt="Logo" class="home-logo">
    <h1>Audio Flash</h1>
    <p class="home-subtitle">Elige tu mazo</p>
  </div>
  <div class="deck-grid" id="deckGrid"></div>
  <div class="home-footer">English Memory</div>
</div>

<!-- ================== PLAYER: REPRODUCTOR ================== -->
<div class="view player-view hidden" id="playerView">

  <header class="topbar">
    <button id="btnBack" class="back-btn" title="Volver" aria-label="Volver">
      <i data-lucide="chevron-left"></i>
    </button>
    <div class="topbar-brand">
      <span class="app-name" id="deckName">—</span>
    </div>
    <div class="topbar-actions">
      <button id="btnDeck" class="toolbar-btn" title="Ver mazo completo">
        <i data-lucide="book-open"></i>
        <span class="btn-label">Mazo</span>
      </button>
      <button id="btnOrder" class="toolbar-btn" title="Cambiar orden">
        <i data-lucide="repeat"></i>
        <span class="btn-label" id="orderLabel">Secuencial</span>
      </button>
      <button id="btnDirection" class="toolbar-btn" title="Cambiar dirección">
        <i data-lucide="arrow-right-left"></i>
        <span class="btn-label" id="directionLabel">EN → ES</span>
      </button>
    </div>
  </header>

  <main class="card-area">
    <div class="card" id="card">
      <div class="status" id="status">Cargando…</div>
      <div class="word-en" id="wordEn">—</div>
      <div class="word-es" id="wordEs">—</div>
      <div class="note" id="note"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="counter" id="counter">0 / 0</div>
    </div>
  </main>

  <footer class="controls">
    <button id="btnPrev" class="ctrl-btn" title="Anterior" aria-label="Anterior">
      <i data-lucide="skip-back"></i>
    </button>

    <button id="btnPlay" class="ctrl-btn primary" title="Reproducir" aria-label="Reproducir">
      <i data-lucide="play" class="icon-play"></i>
      <i data-lucide="pause" class="icon-pause"></i>
    </button>

    <button id="btnNext" class="ctrl-btn" title="Siguiente" aria-label="Siguiente">
      <i data-lucide="skip-forward"></i>
    </button>

    <div class="speed-wrap">
      <label for="speed">Velocidad</label>
      <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
      <span id="speedValue">1.0x</span>
    </div>

    <div class="pause-wrap">
      <label for="pause">Pausa</label>
      <input type="range" id="pause" min="0" max="5" step="0.5" value="2">
      <span id="pauseValue">2s</span>
    </div>

    <div class="limit-wrap">
      <label for="limit">Tarjetas</label>
      <select id="limit"></select>
    </div>

    <div class="tag-wrap">
      <label for="tag">Categoría</label>
      <select id="tag"></select>
    </div>
  </footer>

</div>

<!-- PANEL DEL MAZO -->
<div class="deck-modal" id="deckModal">
  <div class="deck-modal-content">
    <div class="deck-modal-header">
      <h2 id="deckTitle">Mazo completo</h2>
      <button id="btnCloseDeck" class="close-btn" title="Cerrar" aria-label="Cerrar">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="deck-list" id="deckList"></div>
  </div>
</div>

<audio id="player"></audio>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>

</body>
</html>
